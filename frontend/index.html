<!doctype html>
<!-- data-theme is the dark/light switch (STANDARDS §2.2). Dark is the default;
     theme.ts flips this attribute at runtime. Set here so first paint is dark
     and never flashes. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app-name</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
