[workspace]
resolver = "3"
members = ["app-name-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# --- Tauri shell ---
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# --- Shared (core + shell) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# toml and chrono are pre-staged for the first config and timestamp work
# (STANDARDS §4.4 config, §5.5 BenchLog timestamps). Remove if unused after
# the first real app is built.
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "now"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# File logging: daily-rotating appender with N-file retention (STANDARDS §4.2).
# Part of the official tokio-rs/tracing project, the canonical companion to
# tracing-subscriber — not a niche crate.
tracing-appender = "0.2"
directories = "6"

# Lints applied to first-party crates. Scoped here (not via RUSTFLAGS) so
# warnings from macro-generated code and transitive deps don't break the build.
# `unsafe_code` is "deny" not "forbid": tauri's generated glue and the mobile
# entry-point macro can expand to `unsafe` blocks, and forbid is unoverridable.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release profile per STANDARDS §5.2. Tuned for shippable artifact size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
