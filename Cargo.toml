[workspace]
resolver = "3"
members = ["emfit-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# --- Tauri shell ---
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# --- Shared (core + shell) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# toml and chrono are pre-staged for the first config and timestamp work
# (STANDARDS sec 4.4 config, sec 5.5 BenchLog timestamps). Remove if unused after
# the first real app is built.
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "now"] }
thiserror = "2"
anyhow = "1"
# Parallel MFT record parsing (roadmap M1: "rayon across the buffer").
rayon = "1"
# The search's regex filter field (roadmap M2, features.md sec 2).
regex = "1"
# Diacritic-insensitive matching (features.md sec 2): canonical decomposition
# gives the base character a search for `e` must also find in `resume`.
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# File logging: daily-rotating appender with N-file retention (STANDARDS sec 4.2).
# Part of the official tokio-rs/tracing project, the canonical companion to
# tracing-subscriber - not a niche crate.
tracing-appender = "0.2"
directories = "6"

# Scan-cache container (service::cache). lz4_flex is pure Rust with safe
# encode/decode by default - a 250 MB snapshot compresses off the UI thread and
# decompresses faster than the bytes it saves reading. twox-hash gives the
# per-section xxh3 checksum that decides corrupt-cache from good.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

# Update checking (service::update): fetching the release manifest and the
# binary it points at. Blocking API, which suits the worker thread the scan
# and search code already use. `platform-verifier` validates against the
# Windows certificate store rather than a set of roots baked into our binary,
# so a machine behind a TLS-inspecting corporate proxy still connects.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
# Checksum for a downloaded release. The manifest carries no hash today, so
# this verifies nothing yet; it is wired so that publishing a `sha256` field
# turns checking on with no code change (service::update::verify).
sha2 = "0.10"

# --- Windows only ---
# Volume discovery and elevation (`service::volume`, `service::elevation`).
# Pulled in through a `[target.'cfg(windows)'.dependencies]` block, so the core
# still compiles on Linux and macOS with those paths stubbed - which CI needs
# (STANDARDS sec 5.2). Everything else in the engine, including raw device reads,
# goes through `std` and needs no bindings.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  # SHELLEXECUTEINFOW lives behind the Registry feature in windows-rs, though
  # nothing here touches the registry. Needed for the elevated relaunch.
  "Win32_System_Registry",
  # K32GetProcessMemoryInfo, for the CLI's peak-RSS report (roadmap M1 exit
  # criterion: peak RSS documented per scan).
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Shell context-menu hosting in the app shell (roadmap M4): COM init,
  # IShellFolder/IContextMenu (+ ITEMIDLIST in Shell_Common), the owner
  # window class (WNDCLASSW drags in Gdi's HBRUSH), clipboard for Copy path.
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
] }

# Lints applied to first-party crates. Scoped here (not via RUSTFLAGS) so
# warnings from macro-generated code and transitive deps don't break the build.
# `unsafe_code` is "deny" not "forbid": tauri's generated glue and the mobile
# entry-point macro can expand to `unsafe` blocks, and forbid is unoverridable.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `tauri dev` runs the DEBUG profile: at opt-level 0 the engine's tight
# loops (MFT sweep, match-all search, 3M-row sorts) run 10-50x slower than
# release, which makes perceived performance unjudgeable in dev. Optimize
# the engine crate and all dependencies even in dev - they are built once
# and cached; the shell crate stays at 0 for fast edit-compile cycles.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.emfit-core]
opt-level = 2

# For sampling profilers (samply, Superluminal, WPA): release-grade speed
# with symbols kept. `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Release profile per STANDARDS sec 5.2. Tuned for shippable artifact size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
