name: Release

# Two ways to cut a release, both producing downloadable executables and a
# GitHub Release:
#
#   - Push a tag `vX.Y.Z`  -> the tag's version is forced into all version files
#     and the executables for that exact version are built and published.
#   - Run manually (Actions -> Release -> Run workflow) and pick patch / minor /
#     major -> the canonical VERSION is bumped, committed, tagged, and published.
#
# The version lives in one file (`VERSION`) and is propagated to package.json,
# Cargo.toml, tauri.conf.json, and package-lock.json by scripts/version.js — so a
# human only ever decides the bump level (or the tag), never edits versions by hand.

env:
  # Matches the cargo `[[bin]]` name / tauri `mainBinaryName`, so it is both the
  # built executable's filename and the display name used in the Release title.
  APP_NAME: EmFit

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (manual release)'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

# Needed to push the bump commit/tag and to create the GitHub Release.
permissions:
  contents: write

jobs:
  # Decide the version. Tag push: force it from the tag. Manual dispatch: bump,
  # commit, and push the tag (pushes made with GITHUB_TOKEN don't re-trigger this
  # workflow, so there's no double run). Outputs the version + tag the rest builds.
  prepare:
    runs-on: [self-hosted, self-linux]
    # ONLY run if:
    # 1. It's a manual run ON the main branch
    # 2. OR it's a push of a tag starting with 'v'
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      app_name: ${{ steps.export_name.outputs.app_name }} # Exporting name to other jobs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export App Name
        id: export_name
        run: echo "app_name=${{ env.APP_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag push -> forcing version $VERSION"
            node scripts/version.js set "$VERSION"
          else
            echo "Manual dispatch -> ${{ inputs.bump }} bump"
            node scripts/version.js bump "${{ inputs.bump }}"
            VERSION="$(node scripts/version.js current)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): v$VERSION"
            # A pre-existing tag means this version was already released - fail
            # loudly rather than silently re-release (the "forgot to bump" guard).
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists - bump to a new version"
              exit 1
            fi
            git tag "v$VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push origin "v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # Build the release executable only (no installers) for each desktop target.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runners (see the labels noted in checks.yml). macOS off for now.
        include:
          # Use needs.prepare.outputs.app_name instead of env.APP_NAME
          - { 
              label: windows-x64, 
              runner: [self-hosted, self-windows], 
              bin: "${{ needs.prepare.outputs.app_name }}.exe", 
              asset: "${{ needs.prepare.outputs.app_name }}-windows-x64.exe" 
            }
          # - { 
          #     label: linux-x86_64, 
          #     runner: [self-hosted, self-linux], 
          #     bin: "${{ needs.prepare.outputs.app_name }}", 
          #     asset: "${{ needs.prepare.outputs.app_name }}-linux-x86_64" 
          #   }

    runs-on: ${{ matrix.runner }}
    name: build-${{ matrix.label }}

    steps:
      # Windows caps paths at 260 chars unless git opts out
      - name: Enable git long paths (Windows)
        if: contains(matrix.label, 'windows')
        shell: cmd
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # Self-hosted: keep target/ + node_modules/ + cargo caches on disk
          clean: false

      # Prefer Git Bash on PATH (Windows)
      - name: Prefer Git Bash on PATH (Windows)
        if: contains(matrix.label, 'windows')
        shell: cmd
        run: echo C:\Program Files\Git\bin>>%GITHUB_PATH%

      - name: Install Linux system dependencies
        if: contains(matrix.label, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Install cargo-about
      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      # Stamp version
      - name: Stamp version
        run: node scripts/version.js set "${{ needs.prepare.outputs.version }}"

      - name: Build executable (no bundle)
        run: npm run tauri -- build --no-bundle

      # Staging binary
      - name: Stage binary (Windows)
        if: contains(matrix.label, 'windows')
        run: |
          if (!(Test-Path dist)) { New-Item -ItemType Directory -Force -Path dist }
          Copy-Item "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Stage binary (Unix)
        if: ${{ !contains(matrix.label, 'windows') }}
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Collect the per-platform executables and publish the GitHub Release.
  release:
    needs: [prepare, build]
    runs-on: [self-hosted, self-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*/*

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: WCDAHT

      - name: Notify website
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            -X POST \
            -d "{\"event_type\": \"new_release\", \"client_payload\": {\"repo\": \"${{ github.event.repository.name }}\"}}" \
            https://api.github.com/repos/WCDAHT/WCDAHT.github.io/dispatches