[package]
name = "emfit-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Config system (service::config): TOML on disk, resolved under the OS config
# dir for the hardcoded company/product (see `app.rs`).
toml = { workspace = true }
directories = { workspace = true }
# Logging system (service::logging): file subscriber + daily rotation.
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
# The MFT sweep parses each read chunk across threads (parser::ntfs::scanner).
rayon = { workspace = true }
# Search's regex filter field (service::query).
regex = { workspace = true }

# Volume discovery and elevation checks. Windows-only by design: the rest of
# the core - including raw device reads - runs on `std` alone, so Linux and
# macOS CI still build and test everything above the discovery layer.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[lints]
workspace = true
